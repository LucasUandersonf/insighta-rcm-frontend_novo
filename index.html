<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insighta RCM</title>
    <!-- Aplica o tema salvo ANTES do primeiro paint — evita o "flash"
         de tema errado (ex: usuário escolheu claro, mas a página pisca
         escura por uma fração de segundo antes do React montar). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("insighta-rcm:theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : stored === "system" || !stored
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light"
                : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvas text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
