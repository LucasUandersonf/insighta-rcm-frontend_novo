name: CI

# Achado do Laudo de Vistoria Técnica (parecer DevOps/SRE, bloqueador, e
# parecer Frontend): "nada IMPEDE um código quebrado de ir para
# produção" — nem os 77 testes de interface nem o build eram checados
# antes do deploy. O gatilho `push` em `main` abaixo é EXIGÊNCIA do
# próprio Railway para o toggle "Wait for CI" (ver
# https://docs.railway.com/deployments/github-autodeploys#wait-for-ci):
# sem essa combinação exata de evento/branch, a opção nem aparece nas
# configurações do serviço.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Testes + build de produção
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar suíte de testes (Vitest + Testing Library + axe-core)
        run: npm test

      - name: Checar tipos e gerar o build de produção
        # Sem VITE_API_BASE_URL configurada aqui de propósito: a variável
        # só é lida em tempo de EXECUÇÃO (ver isApiConfigured em
        # api-client.ts), nunca falha o build em si — o valor real de
        # produção continua vindo só da própria Railway.
        run: npm run build

      # Achado do Laudo de Vistoria Técnica (parecer Backend/Segurança,
      # aplicado também ao frontend): nenhuma biblioteca de terceiro era
      # verificada contra falha de segurança conhecida.
      #
      # DECISÃO — só dependências de PRODUÇÃO (--omit=dev), nível alto+
      # -------------------------------------------------------------------
      # As vulnerabilidades conhecidas hoje (checado nesta mesma rodada)
      # são todas em ferramenta de BUILD/teste (esbuild/vite/vitest,
      # nunca embarcadas no pacote que o navegador baixa) — bump maior
      # de versão, fora do escopo de "ligar o scanner". Rodar contra
      # produção mantém o scanner ÚTIL desde o primeiro dia (0
      # vulnerabilidades hoje) em vez de já nascer ignorando tudo — e
      # continua pegando qualquer coisa nova que afete o que roda de
      # verdade no navegador do cliente.
      - name: Verificar vulnerabilidades conhecidas nas dependências de produção
        run: npm audit --omit=dev --audit-level=high
