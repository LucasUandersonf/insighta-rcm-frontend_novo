# railway.toml — sistema (app React). A landing usa landing/railway.toml.
#
# O app é servido pelo nginx (Dockerfile na raiz), não mais pelo
# `vite preview`: cabeçalhos de segurança de verdade (CSP com
# frame-ancestors, HSTS) e cache dos arquivos com hash.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
