# railway.toml — referência apenas.
#
# A Railway descontinuou a configuração por arquivo (config-as-code); os
# valores valem no painel de cada serviço. Configuração atual do serviço do
# app (homologação e produção):
#   Builder: Dockerfile · Dockerfile path: Dockerfile · Healthcheck: /health
# A landing usa landing/Dockerfile, start /start.sh e healthcheck /health
# (ver landing/README.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
